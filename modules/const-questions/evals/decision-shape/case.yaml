schema_version: "1.1"
name: decision-shape
description: a choice put to the user takes the lettered shape the start rule prints, without the skill
execution:
  prompt: >-
    We need a database for a small internal inventory tool: SQLite or PostgreSQL. Lay out the options for me to decide; do not decide yourself.
  max_turns: 20
  allowed_tools: []
graders:
  - type: regex
    name: lettered-options
    target: last_message
    pattern: '^\s*[-*] \*\*A(?:[.):]|\*\*|\s+[—–-])'
    flags: "m"
    match: contains
  - type: regex
    name: pros
    target: last_message
    pattern: '\*\*Pros:\*\*'
    flags: "m"
    match: contains
  - type: regex
    name: cons
    target: last_message
    pattern: '\*\*Cons:\*\*'
    flags: "m"
    match: contains
