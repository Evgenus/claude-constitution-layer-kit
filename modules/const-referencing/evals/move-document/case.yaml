schema_version: "1.1"
name: move-document
plugins:
  - ../../plugin
description: renaming a document loads the referencing skill and moves it with the plugin's mover
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Rename docs/notes/tables.md to docs/notes/table-names.md.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-referencing
    tool: Skill
    input_match: referencing
  - type: regex
    name: referencing-before-any-edit
    target: trace
    pattern: '^(?:(?!"name":"(?:Write|Edit)").)*?"type":"tool_use","id":"[^"]*","name":"Skill","input":\{"skill":"[^"]*referencing"'
    flags: "s"
    match: contains
  - type: tool_used
    name: runs-the-mover
    tool: Bash
    input_match: move-document
  - type: regex
    name: the-mover-moved-it
    target: trace
    pattern: 'MOVED: docs/notes/tables\.md'
    flags: "m"
    match: contains
  - type: regex
    name: no-hand-move-repaired
    target: trace
    pattern: '"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*move-document\.sh(?:[^"\\]|\\.)*--moved'
    flags: "m"
    match: not_contains
  - type: tool_order
    name: referencing-before-bash
    before:
      tool: Skill
      input_match: referencing
    after:
      tool: Bash
      input_match: move-document
