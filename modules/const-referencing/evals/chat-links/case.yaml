schema_version: "1.1"
name: chat-links
plugins:
  - ../../plugin
description: a file named in chat is written as a markdown link, as the start rule asks
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Which document in docs/ says how we name database tables? Answer in one sentence.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
graders:
  - type: regex
    name: file-as-link
    target: last_message
    pattern: '\]\([^)]*tables\.md'
    flags: "m"
    match: contains
