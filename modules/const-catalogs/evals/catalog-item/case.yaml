schema_version: "1.1"
name: catalog-item
description: a new numbered record loads the numbering skill before the record is written
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Write a new decision record: the project keeps its data in SQLite, decided by the project lead.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-catalog-item
    tool: Skill
    input_match: catalog-item
  - type: regex
    name: catalog-item-before-any-edit
    target: trace
    pattern: '^(?:(?!"name":"(?:Write|Edit)").)*?"type":"tool_use","id":"[^"]*","name":"Skill","input":\{"skill":"[^"]*catalog-item"'
    flags: "s"
    match: contains
  - type: file_exists
    name: the-record-is-made
    path: "docs/decisions/adr-0002-*.md"
