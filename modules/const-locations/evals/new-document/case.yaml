schema_version: "1.1"
name: new-document
description: a new note loads the new-document skill and is created through the plugin's command
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Add a note about how we back up the stock database every night.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-new-document
    tool: Skill
    input_match: new-document
  - type: tool_used
    name: runs-the-create-command
    tool: Bash
    input_match: new-document
  - type: tool_order
    name: new-document-before-bash
    before:
      tool: Skill
      input_match: new-document
    after:
      tool: Bash
      input_match: new-document
