schema_version: "1.1"
name: commit-before-edit
description: a batch of edits on a dirty tree loads the commit skill before the first edit
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Rename the function count_items to total_items everywhere in src/ and docs/.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-commit-before-edit
    tool: Skill
    input_match: commit-before-edit
  - type: regex
    name: commit-before-edit-before-any-edit
    target: trace
    pattern: '^(?:(?!"name":"(?:Write|Edit)").)*?"type":"tool_use","id":"[^"]*","name":"Skill"'
    flags: "s"
  - type: regex
    name: the-rename-is-made
    target: { source: file, path: src/inventory.py }
    pattern: 'def total_items'
    flags: "m"
