schema_version: "1.1"
name: close-task
description: closing a branch loads the close skill and runs the range check
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The work on this branch is done: close the task.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-close-task
    tool: Skill
    input_match: close-task
  - type: tool_used
    name: runs-the-range-check
    tool: Bash
    input_match: check-task-close
  - type: regex
    name: the-range-check-ran
    target: trace
    pattern: '[0-9]+ pair\(s\) examined'
    flags: "m"
  - type: tool_order
    name: close-task-before-bash
    before:
      tool: Skill
      input_match: close-task
    after:
      tool: Bash
      input_match: check-task-close
