schema_version: "1.1"
name: set-ceilings
plugins:
  - ../../plugin
description: setting a character ceiling loads the ceiling skill before the dials file is edited
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Set a character ceiling for the notes in docs/notes/ in constitution.yaml.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
    - Bash
graders:
  - type: tool_used
    name: loads-set-ceilings
    tool: Skill
    input_match: set-ceilings
  - type: regex
    name: set-ceilings-before-any-edit
    target: trace
    pattern: '^(?:(?!"name":"(?:Write|Edit)").)*?"type":"tool_use","id":"[^"]*","name":"Skill","input":\{"skill":"[^"]*set-ceilings"'
    flags: "s"
    match: contains
  - type: regex
    name: the-ceiling-is-set
    target: { source: file, path: constitution.yaml }
    pattern: 'ceilings:'
    flags: "m"
    match: contains
