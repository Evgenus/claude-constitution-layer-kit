schema_version: "1.1"
name: record-decision
description: a ruling made in the dialog loads the record skill before it is written down
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    We just agreed in this chat that every pull request needs one reviewer's approval before it is merged. Write that ruling down.
  max_turns: 20
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - Skill
graders:
  - type: tool_used
    name: loads-record-decision
    tool: Skill
    input_match: record-decision
  - type: tool_order
    name: record-decision-before-write
    before:
      tool: Skill
      input_match: record-decision
    after:
      tool: Write
