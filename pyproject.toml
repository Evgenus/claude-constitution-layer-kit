# Development tooling of the kit repository only (decision dec-0020-gate-script-rules).
# Never shipped to consumers: modules carry no tool configuration of their own.
#
# The kit's whole list of checks is scripts/gate-list.sh; CI runs every entry, one job per module, one job
# `install-guide` and one job `kit`, and a job `gates`, green only when every other job is
# (.github/workflows/gates.yml):
#   sh scripts/gate-list.sh --names       sh scripts/gate-list.sh --run <entry>|<job>
# Run from the kit root before a module's scripts are reviewed:
#   python3 -m ruff format --check modules scripts shared && python3 -m ruff check modules scripts shared
#   (cd shared && mypy --strict constitution_layer_kit)
#   (cd modules/<name>/plugin/scripts && MYPYPATH=../../../../shared mypy --strict <package>)
#   (cd modules/<name>/plugin/scripts && MYPYPATH=../../../../shared mypy --strict *.py)   (the entry files beside the packages; no plugin holds the shared package, so MYPYPATH names the kit's shared/)
#   (cd modules/<name>/tests && mypy --strict *.py)
#   python3 scripts/check-shared-links.py && python3 scripts/check-shared-links.py --self-test   (no plugin holds the shared code; each runner reaches it by a link in tests/)
#   python3 scripts/check-shared-package.py && python3 scripts/check-shared-package.py --self-test   (the shared code builds into the distribution `constitution-layer-kit`, which installs and imports in a fresh virtual environment; the one check that needs the package index)
#   python3 scripts/check-carry-lists.py && python3 scripts/check-carry-lists.py --self-test
#   python3 scripts/check-yaml-style.py && python3 scripts/check-yaml-style.py --self-test   (block style of constitution.yaml; --fix rewrites it)
#   python3 scripts/check-module-links.py && python3 scripts/check-module-links.py --self-test   (a module linked outside module prose)
#   python3 scripts/check-handle-forms.py && python3 scripts/check-handle-forms.py --self-test   (a citation of a ruling links its anchor; a module's message keys take no shared key save g3a's; one prefix per kind of handle in a module document; no record table row keyed as a ruling)
#   python3 scripts/check-aspects.py && python3 scripts/check-aspects.py --self-test   (every acceptance item names its rows; --run reports each row, running each module's tests under pytest, one module per run, -n <n> from CONSTITUTION_KIT_JOBS; --module <name> narrows it to one module; the self-test needs coverage.py, pytest and pytest-xdist at the versions of .github/workflows/gates.yml)
#   python3 scripts/check-portability.py && python3 scripts/check-portability.py --self-test   (the A12.1 grep over the installed components)
#   python3 scripts/list-message-literals.py   (review aid of rule 14 of the gate-script rules: message functions no fixture types by hand; a list, never a gate)
#   python3 scripts/check-copies.py && python3 scripts/check-copies.py --self-test   (every copy of the Python floor names the minor of FLOOR in shared/constitution_layer_kit/preflight.py; each entry's C1, C14 and C15 close with its Identity's clause, its C15 reads as shared/GATE.md gives it, its REQUIRES is a release the package serves, and its module's install note gives the pip command at that tag)
#   python3 scripts/check-gate-lists.py && python3 scripts/check-gate-lists.py --self-test  (every declared module scan in the list's gate group, the form of each module's enforcement table, every tracked scripts/check-*.py at the top of scripts/ run by an entry of the gate group; the workflow calls the list)
#   python3 scripts/check-schema-mirror.py && python3 scripts/check-schema-mirror.py --self-test   (the gates' mirror never more lenient than the kernel schemas; the enum and length cases drawn from both sides)
#   python3 scripts/check-dials-schema.py && python3 scripts/check-dials-schema.py --self-test   (the kit's constitution.yaml against the kernel's dials schema)
#   python3 scripts/check-resolved-paths.py && python3 scripts/check-resolved-paths.py --self-test   (every package a runner imports through a link reads __file__ resolved)
#   python3 scripts/check-bare-install.py --self-test && python3 scripts/check-bare-install.py --module <name>   (A12: installed alone on a bare repo; needs the claude scripts/claude-code.version pins first on PATH — sh scripts/setup-claude.sh installs it, and sh scripts/gate-list.sh --run install-<name> puts it first — or CONSTITUTION_KIT_ANY_CLAUDE=1)
#   python3 scripts/check-install-guide.py --self-test && python3 scripts/check-install-guide.py   (INSTALL.md's commands run and do what it says; the plain run needs the same claude, and the branch pushed)
#   sh scripts/gate-list.sh --run types   (every kit script, one run: the `types` entry of scripts/gate-list.sh holds the command and its MYPYPATH)
# And for the kit's own branch-first gate — the first sets the clone's settings, once per clone; the second is red
# in a clone until the first has run:
#   sh scripts/setup-clone.sh
#   sh scripts/setup-clone.sh --check && sh scripts/git-hooks/tests/run.sh
# And for the pinned Claude Code the install checks run on locally — the first installs it into the clone's
# .claude-code-pinned/, once per clone and again after the pin moves; the second tells whether it answers the pin:
#   sh scripts/setup-claude.sh
#   sh scripts/setup-claude.sh --check && sh scripts/tests/setup-claude.sh
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "PLC0415", "C901"]  # PLC0415: rule 16 of the gate-script rules, imports at the top

[tool.ruff.lint.mccabe]
max-complexity = 15  # C901: a function above it is red unless it carries `# noqa: C901`; review reads the reason beside it (dec-0088-ruff-complexity-limit)

[tool.mypy]
python_version = "3.12"
strict = true
