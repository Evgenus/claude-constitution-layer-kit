# Development tooling of the kit repository only (decision dec-0020-gate-script-rules).
# Never shipped to consumers: modules carry no tool configuration of their own.
#
# The kit's whole list of checks is scripts/gate-list.sh; CI runs every entry (.github/workflows/gates.yml):
#   sh scripts/gate-list.sh --names       sh scripts/gate-list.sh --run <entry>
# Run from the kit root before a module's scripts are reviewed:
#   python3 -m ruff format --check modules scripts shared && python3 -m ruff check modules scripts shared
#   (cd shared && mypy --strict const_gate)
#   (cd modules/<name>/scripts && mypy --strict <package>)
#   (cd modules/<name>/tests && MYPYPATH=../scripts mypy --strict *.py)
#   python3 scripts/check-shared-links.py && python3 scripts/check-shared-links.py --self-test
#   python3 scripts/check-carry-lists.py && python3 scripts/check-carry-lists.py --self-test
#   python3 scripts/check-yaml-style.py && python3 scripts/check-yaml-style.py --self-test   (block style of constitution.yaml; --fix rewrites it)
#   python3 scripts/check-module-links.py && python3 scripts/check-module-links.py --self-test   (a module linked outside module prose)
#   (cd scripts && mypy --strict check-module-links.py)
#   python3 scripts/check-aspects.py && python3 scripts/check-aspects.py --self-test   (every acceptance item names its rows; --run reports each row)
#   (cd scripts && mypy --strict check-aspects.py)
#   python3 scripts/check-portability.py && python3 scripts/check-portability.py --self-test   (the A12.1 grep over the installed components)
#   python3 scripts/check-gate-lists.py && python3 scripts/check-gate-lists.py --self-test   (every declared module scan in the gate list and the CI list)
#   (cd scripts && mypy --strict check-portability.py check-gate-lists.py)
#   (cd scripts && mypy --strict check-carry-lists.py)
# And for the kit's own branch-first gate — the first is red in a clone until sh scripts/setup-clone.sh has run once:
#   sh scripts/setup-clone.sh --check && sh scripts/git-hooks/tests/run.sh
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "PLC0415"]  # PLC0415: gate-script rule 16, imports at the top

[tool.mypy]
python_version = "3.12"
strict = true
