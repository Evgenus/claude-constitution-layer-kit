# Development tooling of the kit repository only (decision dec-0020-gate-script-rules).
# Never shipped to consumers: modules carry no tool configuration of their own.
#
# The kit's whole list of checks is scripts/gate-list.sh; CI runs every entry, one job per module and one
# job `kit` (.github/workflows/gates.yml):
#   sh scripts/gate-list.sh --names       sh scripts/gate-list.sh --run <entry>|<job>
# Run from the kit root before a module's scripts are reviewed:
#   python3 -m ruff format --check modules scripts shared && python3 -m ruff check modules scripts shared
#   (cd shared && mypy --strict const_gate)
#   (cd modules/<name>/scripts && mypy --strict <package>)
#   (cd modules/<name>/scripts && mypy --strict *.py)   (the entry files beside the packages)
#   (cd modules/<name>/tests && mypy --strict *.py)
#   python3 scripts/check-shared-links.py && python3 scripts/check-shared-links.py --self-test
#   python3 scripts/check-carry-lists.py && python3 scripts/check-carry-lists.py --self-test
#   python3 scripts/check-yaml-style.py && python3 scripts/check-yaml-style.py --self-test   (block style of constitution.yaml; --fix rewrites it)
#   python3 scripts/check-module-links.py && python3 scripts/check-module-links.py --self-test   (a module linked outside module prose)
#   python3 scripts/check-aspects.py && python3 scripts/check-aspects.py --self-test   (every acceptance item names its rows; --run reports each row)
#   python3 scripts/check-portability.py && python3 scripts/check-portability.py --self-test   (the A12.1 grep over the installed components)
#   python3 scripts/list-message-literals.py   (review aid of template §6 rule 14: message functions no fixture types by hand; a list, never a gate)
#   python3 scripts/check-copies.py && python3 scripts/check-copies.py --self-test   (every copy of the Python floor names the minor of FLOOR in shared/const_gate/preflight.py; each entry's C1, C14 and C15 close with its Identity's clause)
#   python3 scripts/check-gate-lists.py && python3 scripts/check-gate-lists.py --self-test  (every declared module scan in the list's gate group, the form of each module's enforcement table, every tracked scripts/check-*.py at the top of scripts/ run by an entry of the gate group; the workflow calls the list)
#   python3 scripts/check-schema-mirror.py   (the gates' mirror never more lenient than the kernel schemas)
#   python3 scripts/check-dials-schema.py && python3 scripts/check-dials-schema.py --self-test   (the kit's constitution.yaml against the kernel's dials schema)
#   python3 scripts/check-bare-install.py --self-test && python3 scripts/check-bare-install.py --module <name>   (A12: installed alone on a bare repo; needs claude)
#   (cd scripts && MYPYPATH=../modules/const-meta-types/scripts:../modules/const-decision-records/scripts mypy --strict *.py)   (every kit script, one run)
# And for the kit's own branch-first gate — the first is red in a clone until sh scripts/setup-clone.sh has run once:
#   sh scripts/setup-clone.sh --check && sh scripts/git-hooks/tests/run.sh
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "PLC0415"]  # PLC0415: gate-script rule 16, imports at the top

[tool.mypy]
python_version = "3.12"
strict = true
