# Kit tooling, never shipped in a module: the kit's checks on every pull request, one from a fork included, the same jobs
# with nothing changed for it (decision dec-0112-email-forks-and-pypi-before-the-switch), and on main.
# One CI job per job scripts/gate-list.sh names — each module with its scan, install, session-load check,
# fixtures, lint and types, `install-guide` for the run of INSTALL.md, and `kit` for the rest — in parallel; the jobs and their entries are read from the script, never
# written here. Every job runs on every run, none skipped for the paths a change touched: the scans
# read the whole tree or the change's whole range, and every module's gates run the shared gate code.
# The job "gates" waits for all of them and is the one check the ruleset requires, so a new module or
# entry never changes the ruleset; after its verdict it runs the module metrics and the list of the most
# complex functions, reports whose JSON it uploads as the artifact `metrics`, and whose failure never
# changes that verdict. A module's job runs its fixtures one by one under coverage.py, which writes the module's
# coverage file, uploaded as `coverage-<module>`; the job "gates", after its verdict, reads every such
# file into the fixture coverage report, uploaded as `coverage` — a report, whose numbers no check holds
# (decision dec-0089-module-coverage-report). Once the check jobs have ended, one job per module, `mutation
# <module>`, measures a sample of the module's mutants, small changes to its code that its tests should
# notice, for a fixed time and with the commit as the seed, and uploads the module's mutation file as
# `mutation-<module>`; the job "mutation" then reads every such file into the mutation report, uploaded as
# `mutation` — a report too, whose numbers no check holds. The job "gates" needs none of these jobs, so the
# verdict never waits for them, and their steps cannot fail a job; no workflow runs on a schedule for the
# score, and none measures every mutant of a module (decision dec-0122-module-mutation-report).
name: gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # a pull request's newer push replaces its older run; on main each merge has a group of its own, never cut short
  group: gates-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # modules: the jobs that are a module, for the matrix of the mutation samples
        run: |
          echo "jobs=$(sh scripts/gate-list.sh --json)" >> "$GITHUB_OUTPUT"
          echo "modules=$(sh scripts/gate-list.sh --json | jq -c '[.[] | select(startswith("const-"))]')" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.list.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the carry-lists and range checks read the whole history; an install reads its commit's source there
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tools
        run: python3 -m pip install --quiet "PyYAML==6.0.2" "ruff==0.16.8" "mypy==1.8.0" "jsonschema==4.26.0" "referencing==0.37.0" "types-PyYAML==6.0.12.20260815" "types-jsonschema==4.26.0.20260518" "coverage==7.16.2" "pytest==9.1.1" "pytest-xdist==3.8.0"
      - name: Vale and lychee
        # the versions scripts/eval-container/Dockerfile installs too; a change of either file follows in the other
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz \
            | tar -xz -C "$HOME/.local/bin" vale
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # a module's job and install-guide run claude; the kit's install self-test calls none, so kit installs neither
      - name: Node for Claude Code
        if: startsWith(matrix.job, 'const-') || matrix.job == 'install-guide'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Claude Code, for the bare-repo install, the session-load check and the install guide
        if: startsWith(matrix.job, 'const-') || matrix.job == 'install-guide'
        # the version is scripts/claude-code.version, which the install checks and the session-load check ask
        # `claude --version` against
        run: npm install --global --silent "@anthropic-ai/claude-code@$(cat scripts/claude-code.version)"
      - name: Git credentials, for Claude Code's clone of the change's head repository
        if: startsWith(matrix.job, 'const-') || matrix.job == 'install-guide'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Git identity for the fixtures' throwaway repositories
        run: |
          git config --global user.name "gates"
          git config --global user.email "gates@example.invalid"
      - name: Run ${{ matrix.job }}
        env:
          JOB: ${{ matrix.job }}
          # git's credential helper, set by `gh auth setup-git`, reads the token when Claude Code clones
          GH_TOKEN: ${{ (startsWith(matrix.job, 'const-') || matrix.job == 'install-guide') && github.token || '' }}
          CLAUDE_CODE_PLUGIN_PREFER_HTTPS: ${{ (startsWith(matrix.job, 'const-') || matrix.job == 'install-guide') && '1' || '' }}
          # a module's install and its session-load check, and the install guide's marketplace, install from the GitHub repository and branch
          # of the change — the pull request's head, or main on a push — the copy a consumer's install writes; a
          # fork the token cannot read fails
          CONSTITUTION_KIT_INSTALL_FROM: ${{ (startsWith(matrix.job, 'const-') || matrix.job == 'install-guide') && (github.event_name == 'pull_request' && format('{0}#{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || format('{0}#{1}', github.repository, github.ref_name)) || '' }}
          # a module's fixtures entry runs its runner under coverage.py and writes the module's coverage file
          # there (scripts/kit_coverage.py); a coverage failure is a BROKEN line of that entry, and so turns
          # the module's job red, the price decision dec-0089-module-coverage-report chose
          CONSTITUTION_KIT_COVERAGE: ${{ startsWith(matrix.job, 'const-') && format('{0}/coverage', runner.temp) || '' }}
          # no CONSTITUTION_KIT_JOBS: the fixtures entry runs a module's tests one by one, never side by side, which
          # would add load to the runner the gates' own time limits are measured on (decision
          # dec-0091-module-fixtures-run-as-pytest); the mutation samples run in jobs of their own, so the load
          # of their copies reaches no verdict
        run: sh scripts/gate-list.sh --run "$JOB"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && startsWith(matrix.job, 'const-') }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage-${{ matrix.job }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: warn
          retention-days: 5 # read by the job gates of the same run; the merged report keeps the default

  gates:
    needs:
      - list
      - check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every entry green
        env:
          LIST: ${{ needs.list.result }}
          CHECKS: ${{ needs.check.result }}
        run: |
          echo "list: $LIST, checks: $CHECKS"
          test "$LIST" = success && test "$CHECKS" = success
      # The module metrics and the fixture coverage, reports and never checks (scripts/metrics.py,
      # scripts/module-coverage.py): the steps below run after the verdict above, whatever it was, save on
      # a cancelled run, whose newer push or stop wants no report (always() would run them there too);
      # continue-on-error keeps a failure of theirs from turning the job red, and the verdict step's own
      # red stands, since it carries no such flag; each step's timeout bounds a hang at 5 minutes, where
      # the job's own limit is 360 minutes.
      - uses: actions/checkout@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 0 # churn_90d reads the last 90 days of history
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Module metrics, a report
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet "PyYAML==6.0.2"
          # each report's output, a BROKEN line with its fix included, reaches the log and the summary
          # before the step exits with a failing run's code, the later one's when both fail
          status=0
          python3 scripts/metrics.py --json metrics.json > metrics.txt || status=$?
          python3 scripts/metrics.py --complexity --json complexity.json > complexity.txt || status=$?
          cat metrics.txt complexity.txt
          { echo '```'; cat metrics.txt; echo; cat complexity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: metrics
          path: |
            metrics.json
            complexity.json
          if-no-files-found: warn
      - uses: actions/download-artifact@v8
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-files
      - name: Fixture coverage, a report
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # the files the module jobs wrote; the table, its notes, a BROKEN line with its fix, reach the log and
          # the summary before the step exits with the report's code
          status=0
          python3 scripts/module-coverage.py --from coverage-files --json coverage.json > coverage.txt 2> notes.txt || status=$?
          cat coverage.txt notes.txt
          { echo '```'; cat coverage.txt notes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: warn

  # The mutation samples, reports and never checks (scripts/module-mutation.py, decision
  # dec-0122-module-mutation-report): one job per module, started once the check jobs have ended, whatever
  # their verdict, so that no check job waits for a runner behind a sample; the job "gates" does not need
  # them. Every step carries continue-on-error, so that a report that cannot be made leaves its job green
  # and its module out of the table, with a note there; the timeouts bound a hang.
  mutation-sample:
    needs:
      - list
      - check
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    name: mutation ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 70 # above the sum of the steps' own limits, so that a step's limit ends a hang and the job's never does
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.list.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        timeout-minutes: 5
      - uses: actions/setup-python@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Python tools
        # the tools line of the job check, whose versions these are; a change of either line follows in the other
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m pip install --quiet "PyYAML==6.0.2" "jsonschema==4.26.0" "referencing==0.37.0" "coverage==7.16.2" "pytest==9.1.1"
      - name: Vale and lychee
        # the versions of the job check, for the tests that run them
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz \
            | tar -xz -C "$HOME/.local/bin" vale
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Node, for the tests that run npm
        # the version of the job check
        uses: actions/setup-node@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: "22"
      - name: Git identity for the tests' throwaway repositories
        continue-on-error: true
        timeout-minutes: 5
        run: |
          git config --global user.name "gates"
          git config --global user.email "gates@example.invalid"
      # For 150 seconds, in three copies of the kit side by side, the step runs mutants drawn in an order the
      # commit seeds — GITHUB_SHA, the commit the run checks out, on a pull request its merge with the base —
      # each against the tests that reach it, and writes the module's mutation file; the line map before them
      # is one more run of the module's tests, and a mutant begun when the time is spent is finished.
      - name: Mutation sample of ${{ matrix.module }}, a report
        continue-on-error: true
        timeout-minutes: 25
        env:
          MODULE: ${{ matrix.module }}
          OUT: ${{ runner.temp }}/mutation
        run: |
          # the table, the survivors and the notes, a BROKEN line with its fix included, reach the log before
          # the step exits with the report's code
          status=0
          python3 scripts/module-mutation.py --module "$MODULE" --budget 150 --copies 3 --seed "$GITHUB_SHA" --out "$OUT" > mutation.txt 2> mutation-notes.txt || status=$?
          cat mutation.txt mutation-notes.txt
          exit "$status"
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: mutation-${{ matrix.module }}
          path: ${{ runner.temp }}/mutation
          if-no-files-found: warn
          retention-days: 5 # read by the job mutation of the same run; the merged report keeps the default

  # The mutation report over every module's file, after the samples, whatever became of them.
  mutation:
    needs:
      - list
      - mutation-sample
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35 # above the sum of the steps' own limits
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        timeout-minutes: 5
      - uses: actions/setup-python@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: mutation-*
          merge-multiple: true
          path: mutation-files
      - name: Mutation score, a report
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # the files the sample jobs wrote; the table, the survivors, the notes, a BROKEN line with its fix,
          # reach the log and the summary before the step exits with the report's code
          python3 -m pip install --quiet "PyYAML==6.0.2"
          status=0
          python3 scripts/module-mutation.py --from mutation-files --json mutation.json > mutation.txt 2> mutation-notes.txt || status=$?
          cat mutation.txt mutation-notes.txt
          { echo '```'; cat mutation.txt mutation-notes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: mutation
          path: mutation.json
          if-no-files-found: warn
