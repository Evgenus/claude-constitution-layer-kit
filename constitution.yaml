        - "modules/const-change-cost/plugin/hooks/**"
        - "modules/const-change-cost/plugin/skills/**"
        - "modules/const-change-cost/plugin/ccusage/package.json"
        - "modules/const-change-cost/plugin/ccusage/package-lock.json"
        - "modules/const-change-cost/plugin/ccusage.json"
        - "modules/const-change-cost/tests/**"
        - "modules/const-change-cost/evals/**"
      docs:
        - "modules/const-change-cost/MODULE.md"
    - name: const-referencing
      code:
        - "modules/const-referencing/plugin/scripts/**"
        - "modules/const-referencing/plugin/hooks/**"
        - "modules/const-referencing/plugin/skills/**"
        - "modules/const-referencing/tests/**"
