  #       - -c
  #   - command:
  #       - csh
  #     command_flags:
  #       - -c
  #   - command:
  #       - tcsh
  #     command_flags:
  #       - -c
  territories:                        # the documents the list-handles scan reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: a plain item in an accepted record or a frozen comparison takes a bold lead, a wording edit (plc-0004 rule 14, plc-0005 rule 7)
  handles:                            # the forms a list item may open with, after an optional anchor and bold marker; the kit's keys beyond the defaults follow
    - '[0-9]+\.'
    - '[A-Z]\.'
    - '[a-z]\.'
    - '[a-z][0-9]+\.'
    - '[A-Z]+[0-9]+[a-z]?\b'
    - '[A-Z]-[a-z]\b'
    - '\*\*[^*]+\*\*'                # a bold label is the item's key in the kit's documents: "**Always-on content:**"
    - '\*[^*]+\*'                      # an italic lead likewise, in a skill's contrastive list
    - '\[[^\]]+\]\('                   # a link is the key of a reading list or a carry list
    - '`[^`]+`'                        # a code span likewise: a file name, a flag
  boundary_examples: []               # session start: the kit's own violates / complies pairs, {violates: …, complies: …}; empty: the seed pairs of MODULE.md §8
  verbosity: triggered                # values: triggered — assumption and restatement lines appear only when triggered, never as ritual

const-styling:                        # one style guide, departures declared here with a reason; a scan-only gate, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  territories:                        # the documents the scan reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: a trace in an accepted record or a frozen comparison is removed by a wording edit where one removes it, else declared by a departure over its path or a number range that holds it (decisions dec-0045-frozen-documents-stay-in-the-style-scan, dec-0048-frozen-documents-take-wording-edits)
  guides: *style                      # skill: the style guides, the territory of their policy by alias
  departures:                         # gate: what departs from a default, where, and why — per kind by pattern, one-off by path
    - paths:
        - "/docs/requirements.md"
      allow:
        - table-empty-cell
      reason: the aspect rows of the matrix are group headings; their three cells hold nothing on purpose

const-language:                       # the prose of covered documents: a grade ceiling, a sentence limit, the constructions plain language avoids (MODULE.md §7)
  severity: block                     # values: block | warn — block: the findings reach the model as a block after the write; warn: as context
  log_dir: local/gate-logs
  territories:                        # the documents the gate reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: an accepted record or a frozen comparison meets the thresholds by wording edits, and what no wording edit reaches stands under a departure below (plc-0004 rule 14, plc-0005 rule 7; decision dec-0048-frozen-documents-take-wording-edits)
  grade_ceiling: 13                   # the module's default is 10: the kit's own descent to it is a work item after this module, 12 then 10, one step per change (decision dec-0046-language-module-rulings)
  sentence_words: 100                 # the module's default is 25: the same descent, 60 then 40 then 25
  levels:                             # per rule: error (a finding, red), warning (a note), off; the defaults, written out
    grade: error
    sentence: error
    forbidden: error
    simpler: error
    passive: off                      # the kit's register is the passive by design — 1,224 notes on the day-one scan, every sampled one chosen — so the rule is off here, not a warning nobody reads (decision dec-0046-language-module-rulings)
  forbidden: []                       # phrases of the kit's own beyond the founding list: none
  simpler: {}                         # pairs of the kit's own beyond the founding list: none
  exceptions: []                      # phrases of the lists the kit keeps on purpose: none
  departures:                         # what stands as written, where, and why — per kind by pattern, one-off by path; a frozen document meets the thresholds by wording edits, and only what no wording edit reaches stands here (decision dec-0048-frozen-documents-take-wording-edits)
    - paths:
        - "/docs/decisions/dec-0040-rules-fit-their-documents.md"
        - "/docs/decisions/dec-0044-styling-module-rulings.md"
        - "/docs/research/res-0007-const-questions.md"
        - "/docs/research/res-0009-const-styling.md"
      allow:
        - sentence
      reason: a list framed by a pair of dashes, or a carry-list entry of homes, which no wording edit splits without changing its meaning

const-doc-budgets:                    # a character ceiling per group of documents, measured after the fact (MODULE.md §7)
  severity: block                     # values: block | warn — block: a finding reaches the model as a block after the write; warn: as context
  log_dir: local/gate-logs
  ceilings:                           # the founding entries set 2026-09-29 by the report --scan --since 2026-09-14, a later entry on the day its own comment names, over its own `window`; each by the rule: the window's longest plus 10 %, rounded up to 1,000; at warning until 30 days of data; every Markdown file git lists stands under one ceiling (decision dec-0052-doc-budgets-module-rulings)
    - name: records   # the accepted records among them frozen: wording edits only (plc-0004 rule 14)
      paths: *decisions
      max: 34000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: comparisons   # the frozen ones among them take wording edits only (plc-0005 rule 7)
      paths: *research
      max: 79000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: policies
      paths: *policies
      max: 22000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: module-documents
      paths: *module_documents
      max: 66000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: kernel
      paths: *kernel
      max: 14000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: install-guide   # set 2026-10-01 on the guide's first day: its length then, 12,862 characters, plus 10 %, rounded up to 1,000
      paths: *install_guide
      max: 15000
      level: warning
      window:
        from: 2026-10-01
        to: 2026-10-01
    - name: intent
      paths: *intent
      max: 8000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: requirements
      paths: *requirements
      max: 46000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: rollout-plan
      paths: *rollout
      max: 48000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    # shared-code, 2026-10-12: raised from 49,000 to 75,000 after the shortening of the page to 74,048 characters,
    # the shortened size rounded up to the next thousand, which leaves 952 characters of room (piece B10 of the G14 brief of the
    # hardcode audit; the decider's pick Q5 (B10) A of 2026-10-12, "shorten what is reasonable. raise the ceiling
    # after"; record dec-0086-three-id-exceptions-partial-surveys-and-three-kit-holds, R9). The reason: the page's
    # ruling text with its message texts exceeds the old ceiling by the inventory's estimate, 58,500 to 61,000
    # characters: 177 ruling sentences, 126 of them homed by 24 records and 51 facts, definitions and limits of the
    # page's own, and 10,573 characters of message texts kept word for word (rule 1 of plc-0009-shared-code). The
    # shortening cut, shortened or named by symbol every passage that carries no ruling, and kept every ruling,
    # message text, anchor and handle. The number is not the window's longest plus 10 %: the window's longest is the
    # size before the shortening, 84,515, which would give about 93,000, so the number is the shortened size with
    # room; the window runs to the day of the measure; the level stays warning.
    - name: shared-code
      paths: *shared_code
      max: 75000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-10-12
    - name: style-guide
      paths: *style
      max: 11000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: guide   # loaded into every session
      paths:
        - "/CLAUDE.md"
      max: 24000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: readme
      paths:
        - "/README.md"
      max: 11000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: module-skills   # every file of a module's skills, SKILL.md and the files beside it
      paths:
        - "modules/*/plugin/skills/**/*.md"
      max: 11000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: install-notes
      paths:
        - "modules/*/plugin/INSTALL.md"
      max: 9000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: module-readmes   # set 2026-10-09 on the pages' second day, their sections elaborated: the longest then, 6,510 characters, plus 10 %, rounded up to 1,000
      paths:
        - "modules/*/README.md"
      max: 8000
      level: warning
      window:
        from: 2026-10-08
        to: 2026-10-09
    - name: kit-agents
      paths:
        - "/.claude/agents/*.md"
      max: 4000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: kit-skills
      paths:
        - "/.claude/skills/**/*.md"
      max: 14000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: templates
      paths:
        - "/templates/**"
      max: 4000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
    - name: module-template
      paths:
        - "/module-template/**"
      max: 23000
      level: warning
      window:
        from: 2026-09-14
        to: 2026-09-29
  departures: []                      # none: every ceiling sits above the frozen documents it holds

const-locations:                      # creates documents; blocks nothing, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  templates:                          # the kinds that have a template; a kind without one is born with the envelope alone
    - policy: plc-0001-root-policy
      template: templates/policy.md
    - policy: plc-0005-research
      template: templates/research-comparison.md
    - policy: plc-0006-module-documents
      template: module-template/MODULE.md
    - policy: plc-0004-decision-records
