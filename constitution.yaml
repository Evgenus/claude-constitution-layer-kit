        to: 2026-11-12
    # rollout-plan, 2026-11-08: kept at 48,000 and moved to error once the plan's done items were trimmed to the form of
    # rule 5 of plc-0008-rollout-plan, which took the plan from about 50,700 to about 40,900 characters (the decider's
    # pick D16 of 2026-11-08 in chat). The number is not the window's longest plus 10 %: the window's longest is the size
    # before the trim, 54,151, which would give 60,000; the window is widened to 30 days so the level may be error.
    - name: rollout-plan
      paths: *rollout
      max: 48000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    # shared-code, 2026-10-12: raised from 49,000 to 75,000 after the shortening of the page to 74,048 characters,
    # the shortened size rounded up to the next thousand, which leaves 952 characters of room (piece B10 of the G14 brief of the
    # hardcode audit; the decider's pick Q5 (B10) A of 2026-10-12, "shorten what is reasonable. raise the ceiling
    # after"; record dec-0086-three-id-exceptions-partial-surveys-and-three-kit-holds, R9). The reason: the page's
    # ruling text with its message texts exceeds the old ceiling by the inventory's estimate, 58,500 to 61,000
    # characters: 177 ruling sentences, 126 of them homed by 24 records and 51 facts, definitions and limits of the
    # page's own, and 10,573 characters of message texts kept word for word (rule 1 of plc-0009-shared-code). The
    # shortening cut, shortened or named by symbol every passage that carries no ruling, and kept every ruling,
    # message text, anchor and handle. The number is not the window's longest plus 10 %: the window's longest is the
    # size before the shortening, 84,515, which would give about 93,000, so the number is the shortened size with
    # room; the window runs to the day of the measure; the level stayed warning until 2026-11-09 (below).
    # shared-code, 2026-11-09: set from the documents as decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text
    # leaves them (shared/GATE.md at 71,265 after its tables moved, the longest of its three pages, plus 10 %, rounded up to 1,000), and moved to error (its R10); not the window's longest, which is the size before that change.
    - name: shared-code
      paths: *shared_code
      max: 79000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: style-guide
      paths: *style
      max: 11000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    # guide, 2026-11-09: set from the documents as decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text
    # leaves them (CLAUDE.md at 20,118 characters after its split, plus 10 %, rounded up to 1,000), and moved to error (its R10); not the window's longest, which is the size before that change.
    - name: guide   # loaded into every session
      paths:
        - "/CLAUDE.md"
      max: 23000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: guide-pages   # set 2026-11-09 on the pages' first day: docs/guide/developing-a-module.md at 16,242 characters plus 10 %, rounded up to 1,000; at warning until 30 days of data
      paths: *guide_pages
      max: 18000
      level: warning
      window:
        from: 2026-11-09
        to: 2026-11-09
    - name: readme
      paths:
        - "/README.md"
      max: 9000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: module-skills   # every file of a module's skills, SKILL.md and the files beside it
      paths:
        - "modules/*/plugin/skills/**/*.md"
      max: 11000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: install-notes
      paths:
        - "modules/*/plugin/INSTALL.md"
        - "/scripts/layered-fixture/plugin/INSTALL.md"   # the install note the fixture gate's failure lines name, the same role
      max: 10000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    # module-readmes, first set 2026-10-09 on the pages' second day, at 8,000; 2026-11-08: re-set by the rule at the key
    # `ceilings` from the 30 days of its window, and moved to error.
    # By decision dec-0118-two-ceilings-follow-the-dials-file, the number, the level and the window of this ceiling are
    # those of this entry, and of no record. A later re-set by the rule at the key `ceilings` is routine: a new window, the
    # number that rule gives from it (the window's longest plus 10 %, rounded up to 1,000), and the level (warning until
    # 30 days of data, error in the change that brings the group under its number). The change that makes the re-set
    # writes its day and its reason in this comment. A change of this entry by another measure, such as a number set from
    # a shortened document, is priced by its stakes like any other change.
    - name: module-readmes
      paths:
        - "modules/*/README.md"
      max: 9000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: kit-agents
      paths:
        - "/.claude/agents/*.md"
      max: 5000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: kit-skills
      paths:
        - "/.claude/skills/**/*.md"
      max: 14000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: templates
      paths:
        - "/templates/**"
      max: 4000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    # module-template, 2026-11-09: kept at 23,000, the number the decider's pick D3 of 2026-11-08 kept, and moved to error
    # once module-template/MODULE.md stood at 22,033 (decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text, R10).
    - name: module-template
      paths:
        - "/module-template/**"
      max: 23000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
  departures:                         # documents that must stand over a ceiling, each with its reason (the set-ceilings skill, section 4)
    - paths:
        - "/docs/decisions/dec-0093-module-evals-with-local-receipts.md"
        - "/docs/decisions/dec-0099-shared-code-installed-as-a-pip-package.md"
      allow:
        - records
      reason: accepted records, frozen by rule 14 of plc-0004-decision-records, which no wording edit it lists brings under 34,000 (decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text, R8)
    - paths:
        - "/docs/decisions/dec-0117-change-cost-module-rulings.md"
      allow:
        - records
      reason: an accepted record, frozen by rule 14 of plc-0004-decision-records, that the wording edits of the language descent took from 33,987 to 34,500 characters on 2026-11-12 (the decider's pick of that day; decision dec-0127-one-pass-to-the-language-defaults, R4)

const-locations:                      # creates documents; blocks nothing, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  templates:                          # the kinds that have a template; a kind without one is born with the envelope alone
    - policy: plc-0001-root-policy
      template: templates/policy.md
    - policy: plc-0005-research
      template: templates/research-comparison.md
    - policy: plc-0006-module-documents
      template: module-template/MODULE.md
    - policy: plc-0004-decision-records
