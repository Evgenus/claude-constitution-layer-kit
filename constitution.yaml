  territories:                        # the documents the list-handles scan reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: a plain item in an accepted record or a frozen comparison takes a bold lead, a wording edit (plc-0004 rule 14, plc-0005 rule 7)
  handles:                            # the forms a list item may open with, after an optional anchor and bold marker; the kit's keys beyond the defaults follow
    - '[0-9]+\.'
    - '[A-Z]\.'
    - '[a-z]\.'
    - '[a-z][0-9]+\.'
    - '[A-Z]+[0-9]+[a-z]?\b'
    - '[A-Z]-[a-z]\b'
    - '\*\*[^*]+\*\*'                # a bold label is the item's key in the kit's documents: "**Always-on content:**"
    - '\*[^*]+\*'                      # an italic lead likewise, in a skill's contrastive list
    - '\[[^\]]+\]\('                   # a link is the key of a reading list or a carry list
    - '`[^`]+`'                        # a code span likewise: a file name, a flag
  boundary_examples: []               # session start: the kit's own violates / complies pairs, {violates: …, complies: …}; empty: the seed pairs of MODULE.md §8
  verbosity: triggered                # values: triggered — assumption and restatement lines appear only when triggered, never as ritual

const-styling:                        # one style guide, departures declared here with a reason; a scan-only gate, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  territories:                        # the documents the scan reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: a trace in an accepted record or a frozen comparison is removed by a wording edit where one removes it, else declared by a departure over its path or a number range that holds it (decisions dec-0045-frozen-documents-stay-in-the-style-scan, dec-0048-frozen-documents-take-wording-edits)
  guides: *style                      # skill: the style guides, the territory of their policy by alias
  departures:                         # gate: what departs from a default, where, and why — per kind by pattern, one-off by path
    - paths:
        - "/docs/requirements.md"
      allow:
        - table-empty-cell
      reason: the aspect rows of the matrix are group headings; their three cells hold nothing on purpose

const-language:                       # the prose of covered documents: a grade ceiling, a sentence limit, the constructions plain language avoids (MODULE.md §7)
  severity: block                     # values: block | warn — block: the findings reach the model as a block after the write; warn: as context
  log_dir: local/gate-logs
  territories:                        # the documents the gate reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: an accepted record or a frozen comparison meets the thresholds by wording edits, and what no wording edit reaches stands under a departure below (plc-0004 rule 14, plc-0005 rule 7; decision dec-0048-frozen-documents-take-wording-edits)
  grade_ceiling: 10                   # the module's default, written out (decision dec-0046-language-module-rulings): the kit came down to it from 13 in one pass on 2026-11-12, not in steps (decision dec-0127-one-pass-to-the-language-defaults)
  sentence_words: 25                  # the module's default, written out: the kit came down to it from 100 in the same pass, not in steps (decision dec-0127-one-pass-to-the-language-defaults)
  levels:                             # per rule: error (a finding, red), warning (a note), off; the defaults, written out
    grade: error
    sentence: error
    forbidden: error
    simpler: error
    passive: off                      # the kit's register is the passive by design — 1,224 notes on the day-one scan, every sampled one chosen — so the rule is off here, not a warning nobody reads (decision dec-0046-language-module-rulings)
  forbidden: []                       # phrases of the kit's own beyond the founding list: none
  simpler: {}                         # pairs of the kit's own beyond the founding list: none
  exceptions: []                      # phrases of the lists the kit keeps on purpose: none
  departures:                         # what stands as written, where, and why — per kind by pattern, one-off by path; a frozen document meets the thresholds by wording edits, and only what no wording edit reaches stands here (decision dec-0048-frozen-documents-take-wording-edits)
