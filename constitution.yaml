# Dials file of the constitution kit itself: the kit is consumer zero of the
# document-shaped modules, of the code territories its own current-state documents
# describe, and of its own session conduct (decisions dec-0006-accumulating-set-first,
# dec-0036-task-close-module-rulings, dec-0041-questions-module-rulings); its sessions
# load the kit's own modules as plugins from .claude/settings.json (decision
# dec-0043-kit-plugins-through-project-settings). Calibration of this repository, never of
# any project. Shape per kernel §3 and §6 (decision
# dec-0008-policies-by-location).
#
# Every dial the kernel and the installed modules know is written here, at its
# default where the kit has not calibrated it, so the file doubles as the inventory
# of what can be set. Each module's MODULE.md §7 is authoritative for the meaning.
#
# Written in block style: one key or one "- " item per line; flow style, [] or {},
# only where a list or a mapping is empty. The gate is scripts/check-yaml-style.py,
# run by the kit's CI on every pull request; its --fix rewrites the file.

# --- kernel-owned keys (kernel §6) -------------------------------------------------

root_policy: docs/policies/plc-0001-root-policy.md   # where the root policy is; absent: no territory is claimed
module_prefix: const-                                # required: the prefix every module's namespace below starts with
territory_dialect: gitignore                    # values: gitignore — the only dialect the readers support; default gitignore

# --- policy namespaces (kernel §3): one per document kind, keyed by the policy's id ---
# The only kernel-defined key is `territory`; a policy's other calibration is its own.

plc-0001-root-policy:                 # the policy for policies; its territory is where policies live
  territory: &policies   # anchored: the plc catalog below numbers exactly this territory
    - "docs/policies/**"

plc-0002-kernel:                      # one policy per document kind (decision dec-0011-one-policy-per-kind)
  territory: &kernel   # anchored: a ceiling of the length gate below holds exactly this territory
    - "docs/constitution/**"

plc-0003-intent-page:
  territory: &intent   # leading slash: a slash-less gitignore pattern matches at any depth
    - "/INTENT.md"

plc-0004-decision-records:
  territory: &decisions   # anchored: the catalog below numbers exactly this territory
    - "docs/decisions/**"

plc-0005-research:
  territory: &research   # anchored: the res catalog below numbers exactly this territory
    - "docs/research/**"

plc-0006-module-documents:
  territory: &module_documents   # anchored: a ceiling of the length gate below holds exactly this territory
    - "modules/*/MODULE.md"

plc-0007-requirements:
  territory: &requirements   # anchored: a ceiling of the length gate below holds exactly this territory
    - "docs/requirements.md"

plc-0008-rollout-plan:
  territory: &rollout   # anchored: a ceiling of the length gate below holds exactly this territory
    - "docs/rollout-plan.md"

plc-0009-shared-code:
  territory: &shared_code   # anchored: a ceiling of the length gate below holds exactly this territory
    - "shared/GATE.md"
    - "shared/MESSAGES.md"
    - "shared/ITEMS.md"

plc-0010-style-guide:                 # the kind of one document, like the intent page (decision dec-0044-styling-module-rulings)
  territory: &style   # anchored: the styling module's guides dial names exactly this territory
    - "/docs/style-guide.md"

plc-0011-install-guide:               # the kind of one document, the kit's install procedure, run by scripts/check-install-guide.py (decision dec-0062-install-guide-governed-kind)
  territory: &install_guide   # anchored: a ceiling of the length gate below holds exactly this territory; the leading slash keeps the modules' own INSTALL.md out
    - "/INSTALL.md"

plc-0012-guide-pages:                 # the pages CLAUDE.md links, each read at its moment (decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text)
  territory: &guide_pages   # anchored: a ceiling of the length gate below holds exactly this territory
    - "docs/guide/**"

# --- module namespaces (kernel §6): a module reads only its own -------------------
# Two dials are every gate's, read by the shared code (shared/GATE.md):
#   severity  values: block | warn — block: a finding blocks in the way the gate's module chose —
#                            a write refused, a finding beside the tool result, a turn held, a prompt
#                            or a refused shell call; warn: reported, the act proceeds (the adoption path).
#                            The --scan mode ignores it and always reports.
#   log_dir   a repository-relative, git-ignored directory for the output log;
#             absent: the platform's per-plugin data directory, or nowhere in CI.

const-meta-types:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs            # every gate's output log, one file per module, in a git-ignored directory

const-decision-records:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  record_policies:   # gate: the policies whose territory holds decision records; [] examines nothing
    - plc-0004-decision-records
  boundary_examples: []             # skill: the project's own routine / recorded pairs, {routine: …, recorded: …}; empty: the seed pairs of MODULE.md §8
  deciders:                         # skill: who may decide at each stakes level, a list of people or roles; empty: the agent asks who decides
    process: []
    product: []
    architecture: []
  note_trailer: ""                  # skill: the commit trailer key carrying a routine note's theme; empty: the log is read only

const-catalogs:                       # numbered kinds are declared here, independent of policies (requirement A13.7)
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  catalogs:                           # gate, skill: the numbered kinds; [] examines nothing
    - prefix: dec   # id and stem dec-<nnnn>-<slug>; width 1–9, default 4
      width: 4
      territory: *decisions
    - prefix: plc   # the kit's policies, plc-<nnnn>-<slug> (decision dec-0034-research-and-policies-numbered)
      width: 4
      territory: *policies
    - prefix: res   # the research comparisons, res-<nnnn>-<slug> (the same decision)
      width: 4
      territory: *research

const-referencing:                    # the kit's own reference forms (requirements A5.5–A5.7); the module knows none of them
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  territories:   # the covered documents among the Markdown files git lists; a negated pattern takes files out
    - "*.md"
  governed_only: false                # values: true | false — true narrows coverage to documents in a policy's territory; needs root_policy
  heading_anchors: refuse             # values: refuse | allow — allow switches R7 off
  bare_ids: refuse                    # values: refuse | allow — allow switches R2 off — for a project whose ids are everyday words
  local_paths: refuse                 # values: refuse | allow — allow switches R4 off — for a project whose documents must show a machine's home directory
  lanes:                              # a bare form is the local alias inside its home document, a link everywhere else; a fix is printed as written, so a name in angle brackets — <n>, <m>, <name>, <path to> — is a place the writer fills, and each fix says with what
    - pattern: '\bM[0-9]+\b'
      names: a module by its number
      fix: '[`const-<name>`](<path to>/docs/requirements.md#const-<name>) — <name> is the name the requirements document gives the module of that number, and <path to> is the path from this document''s folder to the repository''s top folder'
      home:
        - "/docs/requirements.md"
    - pattern: '\bA[0-9]+\.[0-9]+'
      names: a requirement row
      fix: '[requirement A<n>.<m>](<path to>/docs/requirements.md#a<n>-<m>) — A<n>.<m> is the row cited, and <path to> is the path from this document''s folder to the repository''s top folder'
      home:
        - "/docs/requirements.md"
    - pattern: '§ ?[1-9](?![0-9])'      # any one digit, so the pattern holds no count of the kernel's sections; a link to a section the kernel lacks fails as a missing anchor
      names: a kernel section
      fix: '[kernel §<n>](<path to>/docs/constitution/CONVENTIONS.md#k<n>) — <n> is the number of the section cited, and <path to> is the path from this document''s folder to the repository''s top folder'
      home:
        - "/docs/constitution/CONVENTIONS.md"
    - pattern: '(?i)\blaws? [0-9]'
      names: a law
      fix: '[law <n> of CLAUDE.md](<path to>/CLAUDE.md#law-<n>) — <n> is the number of the law cited, and <path to> is the path from this document''s folder to the repository''s top folder'
      home:
        - "/CLAUDE.md"
  mentions:                           # a catalogued item named in a script or a configuration file must exist: no link checker reads those
    - pattern: '\bdec-[0-9]{4}-[a-z0-9-]+'
      files: []                     # patterns of the files read; empty: every file git lists that is no Markdown, no link and not binary
    - pattern: '\bplc-[0-9]{4}-[a-z0-9-]+'   # a policy's id is also its namespace key in this file, so a misspelt key is a finding
      files:                        # of the files the scan reads, every one but the profiles: a profile names the policies of the project that takes it, which the kit does not hold; scripts/check-profiles.py holds the profiles
        - "*"
        - "!/profiles/"             # the folder first: a negated pattern frees no file under a folder that an earlier pattern still matches
        - "!/profiles/**"
    - pattern: '\bres-[0-9]{4}-[a-z0-9-]+'
      files: []

const-task-close:                     # task close as one act: a change that touches described code updates its documents or declares no impact
  severity: block                     # values: block | warn — the turn-end hook: block asks the model to commit once; the kit's rule is never to end a turn dirty
  log_dir: local/gate-logs
  trunk: main                         # the branch changes land on: the base of a bare scan on a work/* branch; on main, the last landed change
  trunk_remote: origin                # values: the name of a git remote — the one whose tracking branch of the trunk is read beside the local one, and the trunk when git finds the local one its ancestor or equal to it, or finds none; default origin
  declaration_key: No-Doc-Impact      # the trailer key: "No-Doc-Impact: <pair name> — <reason>" on a commit of the change; the kit's CI gives the scan no pull request description, so the description form is not read here
  working_files: []                   # the kit tracks no working files: local/ is git-ignored and scratch work lives outside the repository
  coverage:                           # the code territories the kit's current-state documents describe; a change touching one updates the document or declares no impact
    - name: shared-gate-code
      code:
        - "shared/constitution_layer_kit/**"
      docs:
        - "shared/GATE.md"
        - "shared/MESSAGES.md"
        - "shared/ITEMS.md"
    - name: const-meta-types
      code:
        - "modules/const-meta-types/plugin/scripts/**"
        - "modules/const-meta-types/plugin/hooks/**"
        - "modules/const-meta-types/plugin/skills/**"
        - "modules/const-meta-types/tests/**"
        - "modules/const-meta-types/evals/**"
      docs:
        - "modules/const-meta-types/MODULE.md"
    - name: const-decision-records
