    - name: const-doc-budgets
      code:
        - "modules/const-doc-budgets/plugin/scripts/**"
        - "modules/const-doc-budgets/plugin/hooks/**"
        - "modules/const-doc-budgets/plugin/skills/**"
        - "modules/const-doc-budgets/tests/**"
        - "modules/const-doc-budgets/evals/**"
      docs:
        - "modules/const-doc-budgets/MODULE.md"
    - name: kit-scripts   # the git hooks, the clone setup, the kit gates and the development routine
      code:
        - "scripts/**"
        - "/pyproject.toml"
      docs:
        - "CLAUDE.md"
    - name: kernel-schemas
      code:
        - "kernel/schemas/**"
      docs:
        - "kernel/CONVENTIONS.md"

const-questions:                      # ask at recorded stakes or a blocker; no open question inside a deliverable
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  territories:                        # gate: the delivered documents among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the templates included: they quote the marker syntax only in code (decision dec-0048-frozen-documents-take-wording-edits)
    # a draft module document is taken out here by its own path while it carries [decide: slots, never by a wildcard
  markers:                            # gate: the texts that mark an open question, matched outside code
    - '[decide:'
    - 'TODO'
    - 'TBD'
    - 'FIXME'
  boundary_examples: []               # skill: the kit's own ask / decide pairs, {ask: …, decide: …}; empty: the seed pairs of MODULE.md §8
  preferences:                        # skill: per decider, the topics to ask about, the topics to decide and note, and how a pick is taken
    - decider: Eugene Chernyshov
      ask: []
      decide: []
      pick: letter                    # values: tool | letter — letter: the argument was lost behind the tool in this decider's sessions

const-interaction:                    # answer shape, assumptions and addressable lists on a session-start carrier; a prompt before a listed destructive command
  severity: block                     # values: block | warn — block: a listed command asks the user at the platform's prompt; warn: reported, the command runs
  log_dir: local/gate-logs
  # destructive, wrappers and shells are absent here, so the gate uses the module's defaults; they are
  # written out below, commented, exactly as the code and MODULE.md §7 hold them, as the inventory of
  # what the gate reads. Uncommented, `destructive` as a list replaces the defaults whole, and an empty
  # list gates nothing and says so at session start; a `wrappers` or `shells` entry is applied to the
  # defaults by its command: it replaces that default, or adds a new one, or drops it with drop: true,
  # and every replaced or dropped default is named at each session start (all 32 below, uncommented).
  # destructive:
  #   - command:
  #       - git
  #       - push
  #     flags:
  #       - --force
  #       - -f
  #     teach: 'a forced push rewrites the branch on the remote: every other clone of it diverges, and the commits it replaced are unreachable there'
  #     alternative: push with --force-with-lease, which refuses when the remote moved, or push a new branch and open a pull request
  #   - command:
  #       - git
  #       - reset
  #     flags:
  #       - --hard
  #     teach: a hard reset discards every uncommitted change in the working tree and the index; nothing brings them back
  #     alternative: run git stash first, or reset with --keep, which stops when a change would be lost
  #   - command:
  #       - git
  #       - checkout
  #     flags:
  #       - -f
  #       - --force
  #     teach: a forced checkout throws away local changes to the files it switches; nothing brings them back
  #     alternative: run git stash first, then check out; or commit the changes on a branch
  #   - command:
  #       - git
  #       - restore
  #     teach: git restore discards the working-tree changes of the paths it names; nothing brings them back
  #     alternative: run git stash first, or git diff to see what would be lost, then restore one path at a time
  #   - command:
  #       - git
  #       - clean
  #     flags:
  #       - -f
  #       - --force
  #     teach: git clean deletes untracked files, which no commit holds; nothing brings them back
  #     alternative: run git clean -n first to see what would go, then move what matters out of the tree
  #   - command:
  #       - git
  #       - branch
  #     flags:
  #       - -D
  #       - -f
  #       - --force
  #     teach: '-D deletes a branch whether or not it is merged, and -f moves one to another commit: the commits left behind become unreachable'
  #     alternative: delete with -d, which refuses an unmerged branch, or tag the tip first (git tag keep/<name>)
  #   - command:
  #       - git
  #       - stash
  #       - drop
  #     teach: a dropped stash is unreachable; nothing lists it again
  #     alternative: apply it with git stash branch <name>, or leave it in the list
  #   - command:
  #       - git
  #       - stash
  #       - clear
  #     teach: clear drops every stash at once; nothing lists them again
  #     alternative: drop one at a time after applying it with git stash branch <name>
  #   - command:
  #       - git
  #       - rebase
  #     teach: 'a rebase rewrites the commits of the branch: their hashes change, and a branch others hold diverges from theirs'
  #     alternative: tag the tip first (git tag keep/<name>), or make the change on a new branch and merge
  #   - command:
  #       - git
  #       - filter-branch
  #     teach: filter-branch rewrites history across every commit it touches
  #     alternative: clone the repository first, and rewrite the clone
  #   - command:
  #       - git
  #       - filter-repo
  #     teach: filter-repo rewrites history across every commit it touches
  #     alternative: clone the repository first, and rewrite the clone
  #   - command:
  #       - git
  #       - reflog
  #       - expire
  #     teach: expiring the reflog removes the record that lets a lost commit be found again
  #     alternative: leave the reflog; disk is cheaper than a lost commit
  #   - command:
  #       - git
  #       - gc
  #     flags:
  #       - --prune=now
  #     teach: pruning now deletes every unreachable object at once, including those the reflog would have let you recover
  #     alternative: run git gc without --prune=now, which keeps recent unreachable objects
  #   - command:
  #       - rm
  #     flags:
  #       - -r
  #       - -R
  #       - --recursive
  #     teach: a recursive rm deletes a directory tree outside git; nothing brings it back
  #     alternative: use git rm for tracked files, or move the directory to a scratch location first
  # wrappers:
  #   - command:
