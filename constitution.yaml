# Dials file of the constitution kit itself: the kit is consumer zero of the
# document-shaped modules (decision dec-0006-accumulating-set-first). Calibration of
# this repository, never of any project. Territory patterns use the default
# dialect, gitignore (kernel §6); no territory_dialect key is needed.
# Shape per kernel §3 and §6 (decision dec-0008-policies-by-location).

root_policy: docs/policies/kit-root-policy.md

kit-root-policy:                      # the policy for policies; its territory is where policies live
  territory: ["docs/policies/**"]

kit-kernel:                           # one policy per document kind (decision dec-0011-one-policy-per-kind)
  territory: ["kernel/**"]

kit-intent-page:
  territory: ["/INTENT.md"]              # leading slash: a slash-less gitignore pattern matches at any depth

kit-decision-records:
  territory: &decisions ["docs/decisions/**"]   # anchored: the catalog below numbers exactly this territory

kit-research:
  territory: ["docs/research/**"]

kit-module-documents:
  territory: ["modules/*/MODULE.md"]

kit-shared-code:
  territory: ["shared/GATE.md"]

kit-requirements:
  territory: ["docs/requirements.md"]

kit-rollout-plan:
  territory: ["docs/rollout-plan.md"]

const-decision-records:               # a module's namespace (kernel §6): its own dials
  record_policies: [kit-decision-records]   # the policies whose territory holds decision records

const-catalogs:                       # numbered kinds are declared here, independent of policies (requirement A13.7)
  catalogs:
    - {prefix: dec, width: 4, territory: *decisions}   # id and stem dec-<nnnn>-<slug>
