# Dials file of the constitution kit itself: the kit is consumer zero of the
# document-shaped modules (decision accumulating-set-first). Calibration of
# this repository, never of any project. Territory patterns use the default
# dialect, gitignore (kernel §6); no territory_dialect key is needed.
# Shape per kernel §3 and §6 (decision policies-by-location).

root_policy: docs/policies/kit-root-policy.md

kit-root-policy:                      # the policy for policies; its territory is where policies live
  territory: ["docs/policies/**"]

kit-kernel:                           # one policy per document kind (decision one-policy-per-kind)
  territory: ["kernel/**"]

kit-intent-page:
  territory: ["/INTENT.md"]              # leading slash: a slash-less gitignore pattern matches at any depth

kit-decision-records:
  territory: ["docs/decisions/**"]
  catalog: {prefix: dec, width: 4}    # a numbered kind (requirement A13.7): id and stem dec-<nnnn>-<slug>

kit-research:
  territory: ["docs/research/**"]

kit-module-documents:
  territory: ["modules/*/MODULE.md"]

kit-requirements:
  territory: ["docs/requirements.md"]

kit-rollout-plan:
  territory: ["docs/rollout-plan.md"]
