# Dials file of the constitution kit itself: the kit is consumer zero of the
# document-shaped modules (decision dec-0006-accumulating-set-first). Calibration of
# this repository, never of any project. Shape per kernel §3 and §6 (decision
# dec-0008-policies-by-location).
#
# Every dial the kernel and the installed modules know is written here, at its
# default where the kit has not calibrated it, so the file doubles as the inventory
# of what can be set. Each module's MODULE.md §7 is authoritative for the meaning.

# --- kernel-owned keys (kernel §6) -------------------------------------------------

root_policy: docs/policies/plc-0001-root-policy.md   # where the root policy is; absent: no territory is claimed
territory_dialect: gitignore                    # values: gitignore — the only dialect the readers support; default gitignore

# --- policy namespaces (kernel §3): one per document kind, keyed by the policy's id ---
# The only kernel-defined key is `territory`; a policy's other calibration is its own.

plc-0001-root-policy:                 # the policy for policies; its territory is where policies live
  territory: &policies ["docs/policies/**"]   # anchored: the plc catalog below numbers exactly this territory

plc-0002-kernel:                      # one policy per document kind (decision dec-0011-one-policy-per-kind)
  territory: ["kernel/**"]

plc-0003-intent-page:
  territory: ["/INTENT.md"]              # leading slash: a slash-less gitignore pattern matches at any depth

plc-0004-decision-records:
  territory: &decisions ["docs/decisions/**"]   # anchored: the catalog below numbers exactly this territory

plc-0005-research:
  territory: &research ["docs/research/**"]   # anchored: the res catalog below numbers exactly this territory

plc-0006-module-documents:
  territory: ["modules/*/MODULE.md"]

plc-0007-requirements:
  territory: ["docs/requirements.md"]

plc-0008-rollout-plan:
  territory: ["docs/rollout-plan.md"]

plc-0009-shared-code:
  territory: ["shared/GATE.md"]

# --- module namespaces (kernel §6): a module reads only its own -------------------
# Two dials are every gate's, read by the shared code (shared/GATE.md):
#   severity  values: block | warn — block: a finding exits 2 and the write is blocked;
#                            warn: reported, the write proceeds (the adoption path).
#                            The --scan mode ignores it and always blocks.
#   log_dir   a repository-relative, git-ignored directory for the output log;
#             absent: the platform's per-plugin data directory, or nowhere in CI.

const-meta-types:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs            # every gate's output log, one file per module, in a git-ignored directory

const-decision-records:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  record_policies: [plc-0004-decision-records]   # gate: the policies whose territory holds decision records; [] examines nothing
  boundary_examples: []             # skill: the project's own routine / recorded pairs, {routine: …, recorded: …}; empty: the seed pairs of MODULE.md §8
  deciders:                         # skill: who may decide at each stakes level, a list of people or roles; empty: the agent asks who decides
    process: []
    product: []
    architecture: []
  note_trailer: ""                  # skill: the commit trailer key carrying a routine note's theme; empty: the log is read only

const-catalogs:                       # numbered kinds are declared here, independent of policies (requirement A13.7)
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  catalogs:                           # gate, skill: the numbered kinds; [] examines nothing
    - {prefix: dec, width: 4, territory: *decisions}   # id and stem dec-<nnnn>-<slug>; width 1–9, default 4
    - {prefix: plc, width: 4, territory: *policies}    # the kit's policies, plc-<nnnn>-<slug> (decision dec-0034-research-and-policies-numbered)
    - {prefix: res, width: 4, territory: *research}    # the research comparisons, res-<nnnn>-<slug> (the same decision)

const-referencing:                    # the kit's own reference forms (requirements A5.5–A5.7); the module knows none of them
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  territories: ["*.md"]               # the covered documents among the Markdown files git lists; a negated pattern takes files out
  governed_only: false                # values: true | false — true narrows coverage to documents in a policy's territory; needs root_policy
  heading_anchors: refuse             # values: refuse | allow — allow switches R7 off
  bare_ids: refuse                    # values: refuse | allow — allow switches R2 off — for a project whose ids are everyday words
  local_paths: refuse                 # values: refuse | allow — allow switches R4 off — for a project whose documents must show a machine's home directory
  lanes:                              # a bare form is the local alias inside its home document, a link everywhere else
    - pattern: '\bM[0-9]+\b'
      names: a module by its number
      fix: '[`const-<name>`](<path to>/docs/requirements.md#const-<name>) — a module number resolves only inside the requirements document'
      home: ["/docs/requirements.md"]
    - pattern: '\bA[0-9]+\.[0-9]+'
      names: a requirement row
      fix: '[requirement A5.3](<path to>/docs/requirements.md#a5-3)'
      home: ["/docs/requirements.md"]
    - pattern: '§ ?[0-9]'
      names: a kernel section
      fix: '[kernel §4](<path to>/kernel/CONVENTIONS.md#k4)'
      home: ["/kernel/CONVENTIONS.md"]
    - pattern: '(?i)\blaws? [0-9]'
      names: a law
      fix: '[law 4 of CLAUDE.md](<path to>/CLAUDE.md#law-4)'
      home: ["/CLAUDE.md"]
  mentions:                           # a catalogued item named in a script or a configuration file must exist: no link checker reads those
    - pattern: '\bdec-[0-9]{4}-[a-z0-9-]+'
      files: []                     # patterns of the files read; empty: every file git lists that is no Markdown, no link and not binary
    - pattern: '\bplc-[0-9]{4}-[a-z0-9-]+'   # a policy's id is also its namespace key in this file, so a misspelt key is a finding
      files: []
    - pattern: '\bres-[0-9]{4}-[a-z0-9-]+'
      files: []

const-task-close:                     # task close as one act: a change that touches described code updates its documents or declares no impact
  severity: block                     # values: block | warn — the turn-end hook: block asks the model to commit once; the kit's rule is never to end a turn dirty
  log_dir: local/gate-logs
  trunk: main                         # the branch changes land on: the base of a bare scan on a work/* branch; on main, the last landed change
  declaration_key: No-Doc-Impact      # the trailer key: "No-Doc-Impact: <pair name> — <reason>" on a commit of the change, or the same line in a pull request's description
  working_files: []                   # the kit tracks no working files: local/ is git-ignored and scratch work lives outside the repository
  coverage:                           # the code territories the kit's current-state documents describe; a change touching one updates the document or declares no impact
    - {name: shared-gate-code, code: ["shared/const_gate/**", "shared/tests/**"], docs: ["shared/GATE.md"]}
    - {name: const-meta-types, code: ["modules/const-meta-types/scripts/**", "modules/const-meta-types/hooks/**", "modules/const-meta-types/skills/**", "modules/const-meta-types/tests/**"], docs: ["modules/const-meta-types/MODULE.md"]}
    - {name: const-decision-records, code: ["modules/const-decision-records/scripts/**", "modules/const-decision-records/hooks/**", "modules/const-decision-records/skills/**", "modules/const-decision-records/tests/**"], docs: ["modules/const-decision-records/MODULE.md"]}
    - {name: const-catalogs, code: ["modules/const-catalogs/scripts/**", "modules/const-catalogs/hooks/**", "modules/const-catalogs/skills/**", "modules/const-catalogs/tests/**"], docs: ["modules/const-catalogs/MODULE.md"]}
    - {name: const-referencing, code: ["modules/const-referencing/scripts/**", "modules/const-referencing/hooks/**", "modules/const-referencing/skills/**", "modules/const-referencing/tests/**"], docs: ["modules/const-referencing/MODULE.md"]}
    - {name: const-locations, code: ["modules/const-locations/scripts/**", "modules/const-locations/skills/**", "modules/const-locations/tests/**"], docs: ["modules/const-locations/MODULE.md"]}
    - {name: const-task-close, code: ["modules/const-task-close/scripts/**", "modules/const-task-close/hooks/**", "modules/const-task-close/skills/**", "modules/const-task-close/tests/**"], docs: ["modules/const-task-close/MODULE.md"]}
    - {name: kit-scripts, code: ["scripts/**", "/pyproject.toml"], docs: ["CLAUDE.md"]}   # the git hooks, the clone setup, the kit gates and the development routine
    - {name: kernel-schemas, code: ["kernel/schemas/**"], docs: ["kernel/CONVENTIONS.md"]}

const-locations:                      # creates documents; blocks nothing, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  templates:                          # the kinds that have a template; a kind without one is born with the envelope alone
    - {policy: plc-0001-root-policy, template: templates/policy.md}
    - {policy: plc-0005-research, template: templates/research-comparison.md}
    - {policy: plc-0006-module-documents, template: module-template/MODULE.md}
    - {policy: plc-0004-decision-records, template: modules/const-decision-records/skills/record-decision/record-template.md}
