# Dials file of the constitution kit itself: the kit is consumer zero of the
# document-shaped modules, of the code territories its own current-state documents
# describe, and of its own session conduct (decisions dec-0006-accumulating-set-first,
# dec-0036-task-close-module-rulings, dec-0041-questions-module-rulings); its sessions
# load the kit's own modules as plugins from .claude/settings.json (decision
# dec-0043-kit-plugins-through-project-settings). Calibration of this repository, never of
# any project. Shape per kernel §3 and §6 (decision
# dec-0008-policies-by-location).
#
# Every dial the kernel and the installed modules know is written here, at its
# default where the kit has not calibrated it, so the file doubles as the inventory
# of what can be set. Each module's MODULE.md §7 is authoritative for the meaning.
#
# Written in block style: one key or one "- " item per line; flow style, [] or {},
# only where a list or a mapping is empty. The gate is scripts/check-yaml-style.py,
# run before every commit that touches this file; its --fix rewrites the file.

# --- kernel-owned keys (kernel §6) -------------------------------------------------

root_policy: docs/policies/plc-0001-root-policy.md   # where the root policy is; absent: no territory is claimed
territory_dialect: gitignore                    # values: gitignore — the only dialect the readers support; default gitignore

# --- policy namespaces (kernel §3): one per document kind, keyed by the policy's id ---
# The only kernel-defined key is `territory`; a policy's other calibration is its own.

plc-0001-root-policy:                 # the policy for policies; its territory is where policies live
  territory: &policies   # anchored: the plc catalog below numbers exactly this territory
    - "docs/policies/**"

plc-0002-kernel:                      # one policy per document kind (decision dec-0011-one-policy-per-kind)
  territory:
    - "kernel/**"

plc-0003-intent-page:
  territory:   # leading slash: a slash-less gitignore pattern matches at any depth
    - "/INTENT.md"

plc-0004-decision-records:
  territory: &decisions   # anchored: the catalog below numbers exactly this territory
    - "docs/decisions/**"

plc-0005-research:
  territory: &research   # anchored: the res catalog below numbers exactly this territory
    - "docs/research/**"

plc-0006-module-documents:
  territory:
    - "modules/*/MODULE.md"

plc-0007-requirements:
  territory:
    - "docs/requirements.md"

plc-0008-rollout-plan:
  territory:
    - "docs/rollout-plan.md"

plc-0009-shared-code:
  territory:
    - "shared/GATE.md"

plc-0010-style-guide:                 # the kind of one document, like the intent page (decision dec-0044-styling-module-rulings)
  territory: &style   # anchored: the styling module's guides dial names exactly this territory
    - "/docs/style-guide.md"

# --- module namespaces (kernel §6): a module reads only its own -------------------
# Two dials are every gate's, read by the shared code (shared/GATE.md):
#   severity  values: block | warn — block: a finding exits 2 and the write is blocked;
#                            warn: reported, the write proceeds (the adoption path).
#                            The --scan mode ignores it and always blocks.
#   log_dir   a repository-relative, git-ignored directory for the output log;
#             absent: the platform's per-plugin data directory, or nowhere in CI.

const-meta-types:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs            # every gate's output log, one file per module, in a git-ignored directory

const-decision-records:
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  record_policies:   # gate: the policies whose territory holds decision records; [] examines nothing
    - plc-0004-decision-records
  boundary_examples: []             # skill: the project's own routine / recorded pairs, {routine: …, recorded: …}; empty: the seed pairs of MODULE.md §8
  deciders:                         # skill: who may decide at each stakes level, a list of people or roles; empty: the agent asks who decides
    process: []
    product: []
    architecture: []
  note_trailer: ""                  # skill: the commit trailer key carrying a routine note's theme; empty: the log is read only

const-catalogs:                       # numbered kinds are declared here, independent of policies (requirement A13.7)
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  catalogs:                           # gate, skill: the numbered kinds; [] examines nothing
    - prefix: dec   # id and stem dec-<nnnn>-<slug>; width 1–9, default 4
      width: 4
      territory: *decisions
    - prefix: plc   # the kit's policies, plc-<nnnn>-<slug> (decision dec-0034-research-and-policies-numbered)
      width: 4
      territory: *policies
    - prefix: res   # the research comparisons, res-<nnnn>-<slug> (the same decision)
      width: 4
      territory: *research

const-referencing:                    # the kit's own reference forms (requirements A5.5–A5.7); the module knows none of them
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  territories:   # the covered documents among the Markdown files git lists; a negated pattern takes files out
    - "*.md"
  governed_only: false                # values: true | false — true narrows coverage to documents in a policy's territory; needs root_policy
  heading_anchors: refuse             # values: refuse | allow — allow switches R7 off
  bare_ids: refuse                    # values: refuse | allow — allow switches R2 off — for a project whose ids are everyday words
  local_paths: refuse                 # values: refuse | allow — allow switches R4 off — for a project whose documents must show a machine's home directory
  lanes:                              # a bare form is the local alias inside its home document, a link everywhere else
    - pattern: '\bM[0-9]+\b'
      names: a module by its number
      fix: '[`const-<name>`](<path to>/docs/requirements.md#const-<name>) — a module number resolves only inside the requirements document'
      home:
        - "/docs/requirements.md"
    - pattern: '\bA[0-9]+\.[0-9]+'
      names: a requirement row
      fix: '[requirement A5.3](<path to>/docs/requirements.md#a5-3)'
      home:
        - "/docs/requirements.md"
    - pattern: '§ ?[0-9]'
      names: a kernel section
      fix: '[kernel §4](<path to>/kernel/CONVENTIONS.md#k4)'
      home:
        - "/kernel/CONVENTIONS.md"
    - pattern: '(?i)\blaws? [0-9]'
      names: a law
      fix: '[law 4 of CLAUDE.md](<path to>/CLAUDE.md#law-4)'
      home:
        - "/CLAUDE.md"
  mentions:                           # a catalogued item named in a script or a configuration file must exist: no link checker reads those
    - pattern: '\bdec-[0-9]{4}-[a-z0-9-]+'
      files: []                     # patterns of the files read; empty: every file git lists that is no Markdown, no link and not binary
    - pattern: '\bplc-[0-9]{4}-[a-z0-9-]+'   # a policy's id is also its namespace key in this file, so a misspelt key is a finding
      files: []
    - pattern: '\bres-[0-9]{4}-[a-z0-9-]+'
      files: []

const-task-close:                     # task close as one act: a change that touches described code updates its documents or declares no impact
  severity: block                     # values: block | warn — the turn-end hook: block asks the model to commit once; the kit's rule is never to end a turn dirty
  log_dir: local/gate-logs
  trunk: main                         # the branch changes land on: the base of a bare scan on a work/* branch; on main, the last landed change
  declaration_key: No-Doc-Impact      # the trailer key: "No-Doc-Impact: <pair name> — <reason>" on a commit of the change, or the same line in a pull request's description
  working_files: []                   # the kit tracks no working files: local/ is git-ignored and scratch work lives outside the repository
  coverage:                           # the code territories the kit's current-state documents describe; a change touching one updates the document or declares no impact
    - name: shared-gate-code
      code:
        - "shared/const_gate/**"
        - "shared/tests/**"
      docs:
        - "shared/GATE.md"
    - name: const-meta-types
      code:
        - "modules/const-meta-types/scripts/**"
        - "modules/const-meta-types/hooks/**"
        - "modules/const-meta-types/skills/**"
        - "modules/const-meta-types/tests/**"
      docs:
        - "modules/const-meta-types/MODULE.md"
    - name: const-decision-records
      code:
        - "modules/const-decision-records/scripts/**"
        - "modules/const-decision-records/hooks/**"
        - "modules/const-decision-records/skills/**"
        - "modules/const-decision-records/tests/**"
      docs:
        - "modules/const-decision-records/MODULE.md"
    - name: const-catalogs
      code:
        - "modules/const-catalogs/scripts/**"
        - "modules/const-catalogs/hooks/**"
        - "modules/const-catalogs/skills/**"
        - "modules/const-catalogs/tests/**"
      docs:
        - "modules/const-catalogs/MODULE.md"
    - name: const-referencing
      code:
        - "modules/const-referencing/scripts/**"
        - "modules/const-referencing/hooks/**"
        - "modules/const-referencing/skills/**"
        - "modules/const-referencing/tests/**"
      docs:
        - "modules/const-referencing/MODULE.md"
    - name: const-locations
      code:
        - "modules/const-locations/scripts/**"
        - "modules/const-locations/skills/**"
        - "modules/const-locations/tests/**"
      docs:
        - "modules/const-locations/MODULE.md"
    - name: const-task-close
      code:
        - "modules/const-task-close/scripts/**"
        - "modules/const-task-close/hooks/**"
        - "modules/const-task-close/skills/**"
        - "modules/const-task-close/tests/**"
      docs:
        - "modules/const-task-close/MODULE.md"
    - name: const-questions
      code:
        - "modules/const-questions/skills/**"
        - "modules/const-questions/tests/**"
      docs:
        - "modules/const-questions/MODULE.md"
    - name: const-interaction
      code:
        - "modules/const-interaction/scripts/**"
        - "modules/const-interaction/hooks/**"
        - "modules/const-interaction/skills/**"
        - "modules/const-interaction/tests/**"
      docs:
        - "modules/const-interaction/MODULE.md"
    - name: const-styling
      code:
        - "modules/const-styling/scripts/**"
        - "modules/const-styling/skills/**"
        - "modules/const-styling/tests/**"
      docs:
        - "modules/const-styling/MODULE.md"
    - name: const-language
      code:
        - "modules/const-language/scripts/**"
        - "modules/const-language/hooks/**"
        - "modules/const-language/skills/**"
        - "modules/const-language/tests/**"
      docs:
        - "modules/const-language/MODULE.md"
    - name: kit-scripts   # the git hooks, the clone setup, the kit gates and the development routine
      code:
        - "scripts/**"
        - "/pyproject.toml"
      docs:
        - "CLAUDE.md"
    - name: kernel-schemas
      code:
        - "kernel/schemas/**"
      docs:
        - "kernel/CONVENTIONS.md"

const-questions:                      # ask at recorded stakes or a blocker; no open question inside a deliverable
  severity: block                     # values: block | warn
  log_dir: local/gate-logs
  territories:                        # gate: the delivered documents among the Markdown files git lists; a negated pattern takes files out
    - "*.md"
    - "!templates/**"                 # a template is no deliverable
    - "!module-template/**"
    # a draft module document is taken out here by its own path while it carries [decide: slots, never by a wildcard
  markers:                            # gate: the texts that mark an open question, matched outside code
    - '[decide:'
    - 'TODO'
    - 'TBD'
    - 'FIXME'
  boundary_examples: []               # skill: the kit's own ask / decide pairs, {ask: …, decide: …}; empty: the seed pairs of MODULE.md §8
  preferences:                        # skill: per decider, the topics to ask about, the topics to decide and note, and how a pick is taken
    - decider: Eugene Chernyshov
      ask: []
      decide: []
      pick: letter                    # values: tool | letter — letter: the argument was lost behind the tool in this decider's sessions

const-interaction:                    # answer shape, assumptions and addressable lists on a session-start carrier; a prompt before a listed destructive command
  severity: block                     # values: block | warn — block: a listed command asks the user at the platform's prompt; warn: reported, the command runs
  log_dir: local/gate-logs
  # destructive: absent — the default list of entries stated in MODULE.md §7; an empty list gates nothing and says so at session start
  territories:                        # the documents the list-handles scan reads among the Markdown files git lists; a negated pattern takes files out
    - "*.md"
    - "!docs/decisions/dec-00[0-3]*.md"   # an accepted record is never edited to fit a later rule (plc-0004 rule 14): the scan applies from dec-0042 on
    - "!docs/decisions/dec-004[01]-*.md"
    - "!docs/research/res-000[1-7]-*.md"   # a comparison is frozen at its module's yes (plc-0005 rule 7): the scan applies from res-0008 on
  handles:                            # the forms a list item may open with, after an optional anchor and bold marker; the kit's keys beyond the defaults follow
    - '[0-9]+\.'
    - '[A-Z]\.'
    - '[a-z]\.'
    - '[a-z][0-9]+\.'
    - '[A-Z]+[0-9]+[a-z]?\b'
    - '[A-Z]-[a-z]\b'
    - '\*\*[^*]+\*\*'                # a bold label is the item's key in the kit's documents: "**Always-on content:**"
    - '\*[^*]+\*'                      # an italic lead likewise, in a skill's contrastive list
    - '\[[^\]]+\]\('                   # a link is the key of a reading list or a carry list
    - '`[^`]+`'                        # a code span likewise: a file name, a flag
  boundary_examples: []               # session start: the kit's own violates / complies pairs, {violates: …, complies: …}; empty: the seed pairs of MODULE.md §8
  verbosity: triggered                # values: triggered — assumption and restatement lines appear only when triggered, never as ritual

const-styling:                        # one style guide, departures declared here with a reason; a scan-only gate, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  territories:                        # the documents the scan reads among the Markdown files git lists; a negated pattern takes files out, never a frozen document
    - "*.md"                          # every document, the frozen ones included: a trace in an accepted record or a frozen comparison is declared by a departure over a number range that holds it, or its path, never by an edit (decision dec-0045-frozen-documents-stay-in-the-style-scan)
  guides: *style                      # skill: the style guides, the territory of their policy by alias
  departures:                         # gate: what departs from a default, where, and why — per kind by pattern, one-off by path
    - paths:
        - "/docs/requirements.md"
      allow:
        - table-empty-cell
      reason: the aspect rows of the matrix are group headings; their three cells hold nothing on purpose

const-language:                       # the prose of covered documents: a grade ceiling, a sentence limit, the constructions plain language avoids (MODULE.md §7)
  severity: block                     # values: block | warn — block: the findings reach the model as a block after the write; warn: as context
  log_dir: local/gate-logs
  territories:                        # the documents the gate reads among the Markdown files git lists; a negated pattern takes files out
    - "*.md"
    - "!docs/decisions/dec-00[0-3]*.md"   # an accepted record is never edited (plc-0004 rule 14) and this gate has no per-document declaration, so the frozen ones leave its territory by number range (decision dec-0046-language-module-rulings); the range grows with each acceptance
    - "!docs/decisions/dec-004[0-5]-*.md"   # dec-0046 joins the range in the commit that names its yes
    - "!docs/research/res-000[1-9]-*.md"   # a comparison is frozen at its module's yes (plc-0005 rule 7): the same route; res-0010 joins the range in the commit that names its yes
  grade_ceiling: 13                   # the module's default is 10: the kit's own descent to it is a work item after this module, 12 then 10, one step per change (decision dec-0046-language-module-rulings)
  sentence_words: 100                 # the module's default is 25: the same descent, 60 then 40 then 25
  levels:                             # per rule: error (a finding, red), warning (a note), off; the defaults, written out
    grade: error
    sentence: error
    forbidden: error
    simpler: error
    passive: off                      # the kit's register is the passive by design — 1,224 notes on the day-one scan, every sampled one chosen — so the rule is off here, not a warning nobody reads (decision dec-0046-language-module-rulings)
  forbidden: []                       # phrases of the kit's own beyond the founding list: none
  simpler: {}                         # pairs of the kit's own beyond the founding list: none
  exceptions: []                      # phrases of the lists the kit keeps on purpose: none

const-locations:                      # creates documents; blocks nothing, so no severity (MODULE.md §7)
  log_dir: local/gate-logs
  templates:                          # the kinds that have a template; a kind without one is born with the envelope alone
    - policy: plc-0001-root-policy
      template: templates/policy.md
    - policy: plc-0005-research
      template: templates/research-comparison.md
    - policy: plc-0006-module-documents
      template: module-template/MODULE.md
    - policy: plc-0004-decision-records
      template: templates/decision-record.md   # the kit's own: the module's template plus what rules 2, 9, 11 and 12 of plc-0004 add
