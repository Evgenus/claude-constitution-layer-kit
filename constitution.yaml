const-doc-budgets:                    # a character ceiling per group of documents, measured after the fact (MODULE.md §7)
  severity: block                     # values: block | warn — block: a finding reaches the model as a block after the write; warn: as context
  log_dir: local/gate-logs
  ceilings:                           # the founding entries set 2026-09-29 by the report --scan --since 2026-09-14, a later entry on the day its own comment names, over its own `window`; each by the rule: the window's longest plus 10 %, rounded up to 1,000; at warning until 30 days of data; an entry at error re-set 2026-11-08 by the report --scan --since 2026-10-09, its window those 30 days, a group moving to error in the change that brings it under its number (rollout plan item 9.9); every Markdown file git lists stands under one ceiling (decision dec-0052-doc-budgets-module-rulings)
    # records, 2026-11-09: kept at 34,000, the number the decider's pick D13 of 2026-11-08 kept, and moved to error; the two
    # frozen records over it stand under departures below (decision dec-0115-long-documents-split-and-carry-entries-follow-moved-text, R8 and R10).
    # A third, over it since the wording edits of 2026-11-12, stands under a departure below too, with its reason there
    # (decision dec-0127-one-pass-to-the-language-defaults, R4).
    - name: records   # the accepted records among them frozen: wording edits only (plc-0004 rule 14)
      paths: *decisions
      max: 34000
      level: error
      window:
        from: 2026-10-09
        to: 2026-11-08
    - name: comparisons   # the frozen ones among them take wording edits only (plc-0005 rule 7)
